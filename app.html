<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Mobile App</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        if (!sessionStorage.getItem("login")) location.replace("index.html");
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="app-container">
        <!-- Header & footer dimuat SEKALI saja -->
        <div id="header"></div>

        <!-- Konten halaman diganti via JS -->
        <main id="main-content" aria-live="polite">
            <!-- Konten dimuat di sini -->
        </main>

        <div id="footer"></div>

        <!-- Modal backup harian -->
        <div id="backupModal" class="modal-backup" role="dialog" aria-modal="true" aria-labelledby="backupModalTitle" hidden>
          <div class="modal-backup__box">
            <div class="modal-backup__icon">
              <i class="fa-solid fa-database" aria-hidden="true"></i>
            </div>
            <h2 class="modal-backup__title" id="backupModalTitle">Backup Harian</h2>
            <p class="modal-backup__text">
              Belum ada backup data hari ini.<br>
              Klik tombol di bawah untuk memulai backup sekarang.
            </p>
            <button type="button" class="btn-primary" id="btnBackupNow">
              <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
              Backup Sekarang
            </button>
          </div>
        </div>
    </div>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/dexie-export-import"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/pages/home.js"></script>
    <script src="assets/js/pages/setting.js"></script>
    <script src="assets/js/pages/data-kategori.js"></script>
    <script src="assets/js/pages/data-kategori-form.js"></script>
    <script src="assets/js/pages/data-customer.js"></script>
    <script src="assets/js/pages/data-customer-form.js"></script>
    <script src="assets/js/pages/data-produk.js"></script>
    <script src="assets/js/pages/data-produk-form.js"></script>
    <!-- file pages lain -->
    <script src="assets/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .catch(err => console.warn('SW gagal:', err));
        }
    </script>
</body>

</html>
