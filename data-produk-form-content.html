<section class="page page--produk-form">

    <div class="page-header page-header--simple">
        <div class="page-header__top">
            <a href="app.html?page=data-produk" class="page-header__btn" aria-label="Kembali">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>
            <div class="page-header__title-wrap">
                <h1 class="page-header__title" id="formTitle">Tambah Produk</h1>
                <p class="page-header__subtitle" id="formSubtitle">Isi data produk baru</p>
            </div>
            <span class="page-header__spacer" aria-hidden="true"></span>
        </div>
    </div>

    <form class="kategori-form" id="produkForm" novalidate>
        <input type="hidden" id="produkMode" value="add">
        <input type="hidden" id="produkId" value="">

        <!-- IMAGE DROPIFY -->
        <div class="form-group">
            <label for="produkImage">Gambar Produk</label>
            <div class="dropify" id="dropifyImage" tabindex="0" role="button"
                 aria-label="Pilih gambar produk">
                <input type="file" id="produkImage" accept="image/png,image/jpeg,image/jpg" hidden>
                <div class="dropify__placeholder" id="dropifyPlaceholder">
                    <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                    <p class="dropify__text">Klik / seret gambar ke sini</p>
                    <p class="dropify__hint">PNG, JPG, JPEG &middot; maks 100 KB</p>
                </div>
                <img class="dropify__preview" id="dropifyPreview" alt="Preview" hidden>
                <button type="button" class="dropify__remove" id="dropifyRemove"
                        aria-label="Hapus gambar" hidden>
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <p class="form-hint" id="imageHint">Gambar akan otomatis dikonversi ke WebP.</p>
        </div>

        <!-- NAMA -->
        <div class="form-group">
            <label for="produkName">Nama Produk</label>
            <div class="form-group__input">
                <i class="fa-solid fa-box form-group__icon" aria-hidden="true"></i>
                <input type="text" id="produkName" name="produkName"
                       placeholder="Contoh: Kopi Susu" autocomplete="off" maxlength="100">
            </div>
            <p class="form-hint">Nama produk wajib diisi.</p>
        </div>

        <!-- KATEGORI -->
        <div class="form-group">
            <label for="produkKategori">Kategori</label>
            <div class="form-group__input">
                <i class="fa-solid fa-tag form-group__icon" aria-hidden="true"></i>
                <select id="produkKategori" name="produkKategori">
                    <option value="">-- Pilih kategori --</option>
                </select>
            </div>
            <p class="form-hint">Kategori wajib dipilih.</p>
        </div>

        <!-- Pemilik -->
        <div class="form-group">
          <label for="produkPemilik">Pemilik</label>
          <div class="form-group__input">
            <i class="fa-solid fa-user form-group__icon" aria-hidden="true"></i>
            <select id="produkPemilik" name="produkPemilik">
              <option value="">-- Pilih Pemilik --</option>
            </select>
          </div>
          <p class="form-hint">Pemilik wajib dipilih.</p>
        </div>

        <!-- HARGA -->
        <div class="form-group">
            <label for="produkHarga">Harga Jual</label>
            <div class="form-group__input">
                <i class="fa-solid fa-money-bill-wave form-group__icon" aria-hidden="true"></i>
                <input type="text" id="produkHarga" name="produkHarga" placeholder="Contoh: 15.000" inputmode="numeric"
                    autocomplete="off">
            </div>
            <p class="form-hint">Harga jual wajib diisi (angka).</p>
        </div>

        <button type="submit" class="btn-primary" id="btnSimpanProduk">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
            Simpan
        </button>
    </form>

</section>
