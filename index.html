<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Login - Mobile App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/dexie-export-import"></script>
</head>

<body>
    <div id="app-container">
        <main id="main-content" class="login-main">
            <section class="login">
                <div class="login__logo" aria-hidden="true">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <h1 class="login__title">Memuat...</h1>
                <p class="login__subtitle"></p>
                <p class="login__pesan" id="pesan" role="alert"></p>

                <!-- BLOK 1: Pilihan awal (belum ada user) -->
                <div class="blok" id="blokPilihan" style="display:none">
                    <button type="button" class="login__button" id="btnPilihRegister">
                        Buat Akun Baru
                    </button>
                    <button type="button" class="login__button login__button--secondary" id="btnPilihImport">
                        Import Data (.json)
                    </button>
                </div>

                <!-- BLOK 2: Import JSON -->
                <div class="blok" id="blokImport" style="display:none">
                    <div class="form-group">
                        <label for="fileJson">File backup (.json)</label>
                        <div class="form-group__input">
                            <input style="padding-top:3%" type="file" id="fileJson" accept=".json,application/json">
                        </div>
                    </div>
                    <button type="button" class="login__button login__button--secondary btn-kembali">
                        Kembali
                    </button>
                </div>

                <!-- BLOK 3: Register -->
                <form class="login__form blok" id="blokRegister" style="display:none" novalidate>
                    <div class="form-group">
                        <label for="regName">Nama</label>
                        <div class="form-group__input">
                            <i class="fa-solid fa-font form-group__icon" aria-hidden="true"></i>
                            <input type="text" id="regName" placeholder="Buat Nama" autocomplete="name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <div class="form-group__input">
                            <i class="fa-regular fa-user form-group__icon" aria-hidden="true"></i>
                            <input type="text" id="regUsername" placeholder="Buat username" autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <div class="form-group__input">
                            <i class="fa-solid fa-lock form-group__icon" aria-hidden="true"></i>
                            <input type="password" id="regPassword" placeholder="Minimal 6 karakter"
                                autocomplete="new-password">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regKonfirmasi">Konfirmasi Password</label>
                        <div class="form-group__input">
                            <i class="fa-solid fa-lock form-group__icon" aria-hidden="true"></i>
                            <input type="password" id="regKonfirmasi" placeholder="Ulangi password"
                                autocomplete="new-password">
                        </div>
                    </div>
                    <button type="submit" class="login__button" id="btnRegister">Daftar</button>
                    <button type="button" class="login__button login__button--secondary btn-kembali">Kembali</button>
                </form>

                <!-- BLOK 4: Login -->
                <form class="login__form blok" id="blokLogin" style="display:none" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="form-group__input">
                            <i class="fa-regular fa-user form-group__icon" aria-hidden="true"></i>
                            <input type="text" id="username" name="username" placeholder="Masukkan username"
                                autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="form-group__input">
                            <i class="fa-solid fa-lock form-group__icon" aria-hidden="true"></i>
                            <input type="password" id="password" name="password" placeholder="Masukkan password"
                                autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="login__button" id="btnLogin">Login</button>
                </form>

                <p class="login__footnote">&copy; 2026 Mobile App</p>
            </section>
        </main>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/db.js"></script>
    <script>
        // Tujuan setelah login/register berhasil (relatif terhadap index.html)
        const HALAMAN_HOME = 'app.html?page=home';

        function masukKeHome(userId) {
            sessionStorage.setItem('login', userId);
            // location.replace(HALAMAN_HOME);   // replace: tombol Back tidak kembali ke halaman login
            window.location.href = HALAMAN_HOME;
        }

        // ===== HASH PASSWORD (PBKDF2 + salt acak, bawaan browser) =====
        function bytesToHex(bytes) {
            return Array.from(bytes).map(function (b) {
                return b.toString(16).padStart(2, '0');
            }).join('');
        }

        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
            }
            return bytes;
        }

        // Hasil disimpan sebagai "salt:hash" (keduanya hex) di kolom password
        async function hashPassword(password, saltHex) {
            const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
            const key = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']
            );
            const bits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' }, key, 256
            );
            return bytesToHex(salt) + ':' + bytesToHex(new Uint8Array(bits));
        }

        async function verifikasiPassword(password, tersimpan) {
            const saltHex = tersimpan.split(':')[0];
            return (await hashPassword(password, saltHex)) === tersimpan;
        }

        // ===== TAMPILAN =====
        function pesan(teks) {
            $('#pesan').text(teks || '');
        }

        function tampilkan(idBlok, judul, subjudul) {
            pesan('');
            $('.blok').hide();
            $('#' + idBlok).show();
            $('.login__title').text(judul);
            $('.login__subtitle').text(subjudul || '');
        }

        async function hitungUserAktif() {
            return db.user.filter(function (u) { return !u.deleted_at; }).count();
        }

        function tampilkanLogin() {
            tampilkan('blokLogin', 'Login', 'Silakan masuk untuk melanjutkan');
        }

        function tampilkanPilihan() {
            tampilkan('blokPilihan', 'Selamat Datang', 'Belum ada akun. Pilih cara memulai');
        }

        // ===== ALUR AWAL =====
        $(async function () {
            try {
                await db.open();
                if ((await hitungUserAktif()) === 0) {
                    tampilkanPilihan();
                } else {
                    tampilkanLogin();
                }
            } catch (err) {
                console.error(err);
                tampilkan('blokPilihan', 'Terjadi Kesalahan', '');
                pesan('Database tidak bisa dibuka: ' + err.message);
            }
        });

        // ===== NAVIGASI PILIHAN =====
        $('#btnPilihRegister').on('click', function () {
            tampilkan('blokRegister', 'Buat Akun', 'Isi data untuk akun pertama');
        });

        $('#btnPilihImport').on('click', function () {
            tampilkan('blokImport', 'Import Data', 'Pilih file backup .json');
        });

        $('.btn-kembali').on('click', tampilkanPilihan);

        // ===== OPSI 1: IMPORT JSON =====
        $('#fileJson').on('change', async function () {
            const input = this;
            const file = input.files[0];
            if (!file) return;

            pesan('Mengimpor data...');
            try {
                await db.import(file, {
                    clearTablesBeforeImport: true,
                    acceptVersionDiff: true,
                    acceptMissingTables: true
                });

                if ((await hitungUserAktif()) === 0) {
                    pesan('Import berhasil, tapi file tidak berisi akun. Buat akun baru atau pilih file lain.');
                    tampilkanPilihan();
                    pesan('File tidak berisi akun. Buat akun baru atau pilih file lain.');
                } else {
                    tampilkanLogin();
                }
            } catch (err) {
                console.error(err);
                pesan('Gagal import: ' + err.message);
            } finally {
                input.value = '';   // supaya file yang sama bisa dipilih ulang
            }
        });

        // ===== OPSI 2: REGISTER =====
        $('#blokRegister').on('submit', async function (e) {
            e.preventDefault();

            const name = $('#regName').val();
            const username = $('#regUsername').val().trim().toLowerCase();
            const password = $('#regPassword').val();
            const konfirmasi = $('#regKonfirmasi').val();

            if (!name) return pesan('Nama wajib diisi');
            if (!username) return pesan('Username wajib diisi');
            if (password.length < 6) return pesan('Password minimal 6 karakter');
            if (password !== konfirmasi) return pesan('Konfirmasi password tidak sama');

            const $btn = $('#btnRegister').prop('disabled', true);
            try {
                // Cek ulang, mencegah dobel klik atau dua tab yang terbuka bersamaan
                if ((await hitungUserAktif()) > 0) {
                    pesan('Akun sudah ada, silakan login');
                    return tampilkanLogin();
                }

                const id = crypto.randomUUID();
                await db.user.add({
                    id: id,
                    name : name,
                    username: username,
                    password: await hashPassword(password)
                });

                // tambah customer
                const idCustomer = crypto.randomUUID();
                await db.customer.add({
                    id: idCustomer,
                    name : 'Umum',
                    no_telp: '-',
                });

                masukKeHome(id);   // langsung ke home, tanpa lewat form login
            } catch (err) {
                console.error(err);
                pesan('Gagal membuat akun: ' + err.message);
            } finally {
                $btn.prop('disabled', false);
            }
        });

        // ===== LOGIN =====
        $('#blokLogin').on('submit', async function (e) {
            e.preventDefault();

            const username = $('#username').val().trim().toLowerCase();
            const password = $('#password').val();

            if (!username || !password) return pesan('Username dan password wajib diisi');

            const $btn = $('#btnLogin').prop('disabled', true);
            try {
                const user = await db.user
                    .where('username').equals(username)
                    .filter(function (u) { return !u.deleted_at; })
                    .first();

                if (!user || !(await verifikasiPassword(password, user.password))) {
                    return pesan('Username atau password salah');
                }

                masukKeHome(user.id);
            } catch (err) {
                console.error(err);
                pesan('Gagal login: ' + err.message);
            } finally {
                $btn.prop('disabled', false);
            }
        });
    </script>
</body>

</html>
