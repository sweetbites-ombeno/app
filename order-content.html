<section class="page page--order">

    <!-- EMPTY STATE -->
    <div class="order-empty" id="orderEmpty" hidden>
        <i class="fa-solid fa-cart-shopping order-empty__icon" aria-hidden="true"></i>
        <h2 class="order-empty__title">Keranjang Kosong</h2>
        <p class="order-empty__text">Pilih menu untuk membuat pesanan</p>
        <button type="button" class="btn-primary order-empty__btn" id="btnPilihMenu">
            <i class="fa-solid fa-utensils" aria-hidden="true"></i>
            Pilih Menu
        </button>
    </div>

    <!-- ISI ORDER -->
    <div id="orderContent" hidden>

        <!-- PESANAN MENU -->
        <h2 class="order-section-title">Pesanan Menu</h2>
        <div class="order-items-card" id="orderItemsCard">
            <!-- Items dirender JS -->
            <button type="button" class="order-add-produk" id="btnTambahProduk">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                <span>Tambah Produk</span>
                <i class="fa-solid fa-arrow-right order-add-produk__arrow" aria-hidden="true"></i>
            </button>
        </div>

        <!-- RINGKASAN -->
        <h2 class="order-section-title">Ringkasan</h2>
        <div class="order-summary-card">
            <div class="order-summary-row">
                <span class="order-summary-row__label">Total</span>
                <span class="order-summary-row__value" id="orderTotal">Rp 0</span>
            </div>
        </div>

        <!-- METODE PEMBAYARAN -->
        <h2 class="order-section-title">Metode Pembayaran</h2>
        <div class="pay-methods" id="payMethods" role="radiogroup" aria-label="Metode pembayaran">
            <button type="button" class="pay-method is-active" data-method="tunai" role="radio" aria-checked="true">
                <i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i>
                <span>Tunai</span>
            </button>
            <button type="button" class="pay-method" data-method="qris" role="radio" aria-checked="false">
                <i class="fa-solid fa-qrcode" aria-hidden="true"></i>
                <span>Qris</span>
            </button>
            <button type="button" class="pay-method" data-method="transfer" role="radio" aria-checked="false">
                <i class="fa-solid fa-building-columns" aria-hidden="true"></i>
                <span>Transfer</span>
            </button>
        </div>

    </div>

    <!-- CART BAR (fixed di atas footer) -->
    <div class="order-cart-bar" id="orderCartBar" hidden>
        <div class="order-cart-bar__info">
            <span class="order-cart-bar__label">Total Bayar</span>
            <span class="order-cart-bar__total" id="orderCartTotal">Rp 0</span>
        </div>
        <button type="button" class="order-cart-bar__btn" id="btnOrderBayar">
            <i class="fa-solid fa-cash-register" aria-hidden="true"></i>
            Bayar
        </button>
    </div>

</section>
