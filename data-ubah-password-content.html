<section class="page page--ubah-password">

    <!-- HEADER CUSTOM -->
    <div class="page-header page-header--simple">
        <div class="page-header__top">
            <a href="app.html?page=setting" class="page-header__btn" aria-label="Kembali">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>

            <div class="page-header__title-wrap">
                <h1 class="page-header__title">Ubah Password</h1>
                <p class="page-header__subtitle">Perbarui kata sandi akun Anda</p>
            </div>

            <span class="page-header__spacer" aria-hidden="true"></span>
        </div>
    </div>

    <!-- FORM -->
    <form class="kategori-form" id="ubahPasswordForm" novalidate>

        <!-- Password Sekarang -->
        <div class="form-group">
            <label for="passwordSekarang">Password Sekarang</label>
            <div class="form-group__input">
                <i class="fa-solid fa-lock form-group__icon" aria-hidden="true"></i>
                <input type="password" id="passwordSekarang" name="passwordSekarang"
                    placeholder="Masukkan password sekarang" autocomplete="current-password">
                <button type="button" class="password-toggle" data-target="passwordSekarang"
                    aria-label="Tampilkan password">
                    <i class="fa-regular fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <p class="form-hint">Masukkan password yang sedang aktif.</p>
        </div>

        <!-- Password Baru -->
        <div class="form-group">
            <label for="passwordBaru">Password Baru</label>
            <div class="form-group__input">
                <i class="fa-solid fa-key form-group__icon" aria-hidden="true"></i>
                <input type="password" id="passwordBaru" name="passwordBaru" placeholder="Minimal 6 karakter"
                    autocomplete="new-password">
                <button type="button" class="password-toggle" data-target="passwordBaru"
                    aria-label="Tampilkan password">
                    <i class="fa-regular fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <p class="form-hint">Minimal 6 karakter. Gunakan kombinasi yang kuat.</p>
        </div>

        <!-- Konfirmasi Password Baru -->
        <div class="form-group">
            <label for="konfirmasiPasswordBaru">Konfirmasi Password Baru</label>
            <div class="form-group__input">
                <i class="fa-solid fa-lock form-group__icon" aria-hidden="true"></i>
                <input type="password" id="konfirmasiPasswordBaru" name="konfirmasiPasswordBaru"
                    placeholder="Ulangi password baru" autocomplete="new-password">
                <button type="button" class="password-toggle" data-target="konfirmasiPasswordBaru"
                    aria-label="Tampilkan password">
                    <i class="fa-regular fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <p class="form-hint">Harus sama dengan password baru.</p>
        </div>

        <p class="save-order-error" id="ubahPasswordError" role="alert"></p>

        <button type="submit" class="btn-primary" id="btnSimpanPassword">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
            Simpan Password
        </button>
    </form>

</section>
