<section class="page page--setting">

    <!-- ============================================
         CARD USER (kartu profil paling kiri)
         ============================================ -->
    <div class="setting-card-wrap">
        <div class="user-card" style="cursor: default;">
            <div class="user-card__avatar">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </div>
            <div class="user-card__info">
                <h3 class="user-card__name">Nama Pengguna</h3>
                <p class="user-card__username">username</p>
                <span class="badge badge--success">
                    <i class="fa-solid fa-circle" aria-hidden="true"></i>
                    Aktif
                </span>
            </div>
        </div>
    </div>

    <!-- ============================================
         KELOMPOK: PRODUK & PENJUALAN
         ============================================ -->
    <h2 class="setting-group__title">Produk &amp; Penjualan</h2>

    <div class="setting-card-wrap">
        <a href="#" class="setting-card" data-menu="data-produk">
            <div class="setting-card__icon setting-card__icon--blue">
                <i class="fa-solid fa-box" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Data Produk</h3>
                <p class="setting-card__desc">Kelola daftar produk</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </a>
    </div>

    <div class="setting-card-wrap">
        <a href="app.html?page=data-kategori" class="setting-card" data-menu="data-kategori">
            <div class="setting-card__icon setting-card__icon--purple">
                <i class="fa-solid fa-tags" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Data Kategori</h3>
                <p class="setting-card__desc">Kelola kategori produk</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </a>
    </div>

    <div class="setting-card-wrap">
        <a href="app.html?page=data-customer" class="setting-card" data-menu="data-customer">
            <div class="setting-card__icon setting-card__icon--amber">
                <i class="fa-solid fa-users" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Data Customer</h3>
                <p class="setting-card__desc">Kelola Customer</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </a>
    </div>

    <div class="setting-card-wrap">
        <a href="#" class="setting-card" data-menu="data-pembelian">
            <div class="setting-card__icon setting-card__icon--blue">
                <i class="fa-solid fa-dollar" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Data Pembelian & Pengeluaran</h3>
                <p class="setting-card__desc">Lihat data Pembelian</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </a>
    </div>

    <div class="setting-card-wrap">
        <a href="#" class="setting-card" data-menu="data-penjualan">
            <div class="setting-card__icon setting-card__icon--green">
                <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Data Penjualan</h3>
                <p class="setting-card__desc">Lihat laporan penjualan</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </a>
    </div>

    <!-- ============================================
         KELOMPOK: AKUN
         ============================================ -->
    <h2 class="setting-group__title">Akun</h2>

    <div class="setting-card-wrap">
        <button type="button" class="setting-card setting-card--button" data-action="update-password">
            <div class="setting-card__icon setting-card__icon--amber">
                <i class="fa-solid fa-key" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Update Password</h3>
                <p class="setting-card__desc">Ubah kata sandi akun</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </button>
    </div>

    <div class="setting-card-wrap">
        <button type="button" class="setting-card setting-card--button" data-action="backup-database">
            <div class="setting-card__icon setting-card__icon--blue">
                <i class="fa-solid fa-database" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Backup Database</h3>
                <p class="setting-card__desc">Share database untuk backup</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </button>
    </div>

    <div class="setting-card-wrap">
      <button type="button" class="setting-card setting-card--button setting-card--danger" data-action="reset-database">
        <div class="setting-card__icon setting-card__icon--red">
          <i class="fa-solid fa-trash" aria-hidden="true"></i>
        </div>
        <div class="setting-card__body">
          <h3 class="setting-card__title">Reset Database</h3>
          <p class="setting-card__desc">Hapus semua data aplikasi</p>
        </div>
        <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
      </button>
    </div>

    <div class="setting-card-wrap">
        <button type="button" class="setting-card setting-card--button setting-card--danger" data-action="logout">
            <div class="setting-card__icon setting-card__icon--red">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </div>
            <div class="setting-card__body">
                <h3 class="setting-card__title">Logout</h3>
                <p class="setting-card__desc">Keluar dari aplikasi</p>
            </div>
            <i class="fa-solid fa-chevron-right setting-card__arrow" aria-hidden="true"></i>
        </button>
    </div>

</section>
