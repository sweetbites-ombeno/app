<section class="page page--produk">

    <!-- HEADER CUSTOM -->
    <div class="page-header">
        <div class="page-header__top">
            <a href="app.html?page=setting" class="page-header__btn" aria-label="Kembali">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>

            <div class="page-header__title-wrap">
                <h1 class="page-header__title">Kelola Produk</h1>
                <p class="page-header__subtitle">Atur produk Anda</p>
            </div>

            <button type="button" class="page-header__btn" id="btnRefreshProduk" aria-label="Muat ulang">
                <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            </button>
        </div>

        <p class="page-header__count" id="produkCount">Memuat...</p>

        <!-- Search + toggle view -->
        <div class="produk-toolbar">
            <div class="page-header__search produk-toolbar__search">
                <i class="fa-solid fa-magnifying-glass page-header__search-icon" aria-hidden="true"></i>
                <input type="search" id="searchProduk" placeholder="Cari produk..." autocomplete="off">
            </div>

            <div class="view-toggle" role="group" aria-label="Mode tampilan">
                <button type="button" class="view-toggle__btn is-active" data-view="grid" aria-label="Tampilan kartu"
                    aria-pressed="true">
                    <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
                </button>
                <button type="button" class="view-toggle__btn" data-view="list" aria-label="Tampilan daftar"
                    aria-pressed="false">
                    <i class="fa-solid fa-list" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <!-- ↓ TAMBAHAN: Badge filter kategori -->
        <div class="produk-filter" id="produkFilter" role="tablist" aria-label="Filter kategori">
            <!-- Badge di-render oleh JS -->
        </div>

    </div>

    <!-- LIST -->
    <div class="produk-list is-grid" id="produkList"></div>

    <!-- Empty -->
    <div class="kategori-empty" id="produkEmpty" style="display:none">
        <i class="fa-solid fa-box-open" aria-hidden="true"></i>
        <p>Belum ada produk.</p>
    </div>

</section>

<button type="button" class="fab-add" data-action="add-produk" aria-label="Tambah produk">
    <i class="fa-solid fa-plus" aria-hidden="true"></i>
</button>
